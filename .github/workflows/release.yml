name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: scripts/release.sh "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-latest
            target: darwin_arm64
          - runner: macos-latest
            target: darwin_amd64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Verify checksum
        working-directory: dist
        run: grep "_${{ matrix.target }}\$" SHA256SUMS | shasum -a 256 -c -
      - name: Run release binary in a fresh environment
        run: |
          binary="dist/worklog_${GITHUB_REF_NAME}_${{ matrix.target }}"
          chmod +x "$binary"
          scripts/smoke-test.sh "$binary" "$GITHUB_REF_NAME"

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "worklog $GITHUB_REF_NAME" \
            --notes "Built from commit $GITHUB_SHA. Verify downloads with SHA256SUMS; see the README for installation."
